[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gloss-opt"
version = "1.0.2"
description = "GLOSS: Global-LOcal-unexplored Sampling Strategy for surrogate-based optimization in vast chemical spaces"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9,<3.13"  # numpy 1.26.4 has no wheel past 3.12
authors = [
  { name = "Baicheng Zhang", email = "zbc@mail.ustc.edu.cn" },
]
dependencies = [
  "numpy==1.26.4",
  "scipy==1.13.1",
  "scikit-learn==1.6.1",
]

[project.optional-dependencies]
surrogates = [
  "torch>=1.9",
  "xgboost>=1.5",
  "lightgbm>=3.3",
]
benchmarks = [
  "pandas>=1.3",
  "matplotlib>=3.5",
  "rdkit>=2022.9",
  "openpyxl>=3.1",
]
full = [
  "torch>=1.9",
  "xgboost>=1.5",
  "lightgbm>=3.3",
  "pandas>=1.3",
  "matplotlib>=3.5",
  "rdkit>=2022.9",
  "openpyxl>=3.1",
  "pytest>=7.0",
]

[project.urls]
Homepage = "https://github.com/pic-ai-robotic-chemistry/gloss-opt"
Repository = "https://github.com/pic-ai-robotic-chemistry/gloss-opt"
Issues = "https://github.com/pic-ai-robotic-chemistry/gloss-opt/issues"

[tool.setuptools.packages.find]
include = ["gloss*"]
